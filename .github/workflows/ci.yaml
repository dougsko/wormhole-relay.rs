name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wormhole-relay.rs
      # the e2e suite boots a Go mailbox-server (rendezvous) as a sibling
      # checkout; the transit path under test is this repository's relay
      - uses: actions/checkout@v4
        with:
          repository: dougsko/wormhole-mailbox
          path: wormhole-mailbox
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wormhole-relay.rs
      - uses: actions/setup-go@v5
        with:
          go-version-file: wormhole-mailbox/go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install magic-wormhole
      - run: cargo build --release --locked
        working-directory: wormhole-relay.rs
      - name: interoperability test (Python magic-wormhole <-> Rust relay)
        working-directory: wormhole-relay.rs
        env:
          WORMHOLE_E2E_REQUIRE: '1'
          WORMHOLE_E2E_MAILBOX_SRC: ${{ github.workspace }}/wormhole-mailbox
        run: bash e2e/run_e2e.sh

  image:
    needs: [test, e2e]
    # only publish on pushes (not on PRs); the image is pushed as linux/amd64 and linux/arm64
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          # arm64 image builds run the Rust compiler under QEMU emulation
          # (Alpine ships no aarch64 musl libc cross-toolchain for cargo)
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
